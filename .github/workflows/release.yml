# Push a tag like v0.1.0 to zip the extension and publish it as a GitHub release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches manifest.json
        run: |
          version=$(jq -r .version manifest.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match manifest.json version $version"
            exit 1
          fi

      - name: Zip the extension
        run: zip -r "wilwid-$GITHUB_REF_NAME.zip" manifest.json *.js *.css popup.html icons

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "wilwid-$GITHUB_REF_NAME.zip" --title "wilwid $GITHUB_REF_NAME" --generate-notes
